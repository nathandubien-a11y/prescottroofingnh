# Builds the static site and uploads it to Hostinger on every push to main
# (including articles Ryze publishes to src/data/blog/).
#
# One-time setup — GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#   FTP_SERVER     Hostinger FTP hostname (hPanel → Files → FTP Accounts), e.g. ftp.prescottroofingnh.com
#   FTP_USERNAME   FTP username from the same page
#   FTP_PASSWORD   FTP password from the same page
# Optional (Variables tab, not Secrets):
#   FTP_SERVER_DIR      Remote folder to upload into. Default "public_html/". Use "/" if your FTP
#                       account already opens inside public_html.
#   FTP_PROTOCOL        Default "ftps" (encrypted). Set to "ftp" only if the upload fails with a TLS error.
#   NEXT_PUBLIC_GTM_ID  Only if you use Google Tag Manager in local builds.
#
# Until the three secrets exist, the workflow builds the site (catching errors) and skips the upload.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}

      - name: Check FTP settings
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP secrets not set yet; the site built fine but was not uploaded. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in repo settings."
          fi

      - name: Upload to Hostinger
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # Only changed files are uploaded; nothing outside the build output is deleted.
